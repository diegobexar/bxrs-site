<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="preview.css">
<style>
.card { padding: 22px 28px; gap: 12px; }
.spec { font-family: var(--font-sans); color: var(--bxrs-ink); text-transform: uppercase; line-height: 0.95; letter-spacing: -0.01em; }
.s1 { font-size: 64px; font-weight: 900; }
.s2 { font-size: 40px; font-weight: 800; }
.s3 { font-size: 22px; font-weight: 700; }
.line { display: flex; align-items: baseline; gap: 16px; }
.tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--bxrs-ink-3); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="line"><div class="spec s1">ARCHIVO 900</div><span class="tag">H1 · 64/0.95</span></div>
  <div class="line"><div class="spec s2">UPPERCASE DISPLAY</div><span class="tag">H2 · 40/1.1</span></div>
  <div class="line"><div class="spec s3">SECTION HEADER</div><span class="tag">H3 · 22/1.15</span></div>
</div></body></html>
