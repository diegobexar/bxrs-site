<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="preview.css">
<style>
.card { padding: 22px 28px; gap: 14px; }
.title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--bxrs-ink-3); text-transform: uppercase; }
.section { display: flex; gap: 24px; align-items: center; }
.section + .section { margin-top: 4px; }
.b1, .b2, .b3 { width: 80px; height: 44px; background: var(--bxrs-paper-2); }
.b1 { border: 1px solid var(--bxrs-ink); }
.b2 { border: 2px solid var(--bxrs-ink); }
.b3 { border: 3px solid var(--bxrs-ink); }
.r0, .r2, .rp { width: 80px; height: 44px; background:#FFD60A; border:2px solid var(--bxrs-ink); }
.r0 { border-radius: 0; }
.r2 { border-radius: 2px; }
.rp { border-radius: 999px; }
.lab { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--bxrs-ink); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="title">Borders &amp; radii — 2px is the workhorse; 0 radius is the default</div>
  <div class="section">
    <span class="lab">BORDER</span>
    <div class="b1"></div><span class="lab">1px hairline</span>
    <div class="b2"></div><span class="lab">2px standard</span>
    <div class="b3"></div><span class="lab">3px hero</span>
  </div>
  <div class="section">
    <span class="lab">RADIUS</span>
    <div class="r0"></div><span class="lab">0 default</span>
    <div class="r2"></div><span class="lab">2 inline code</span>
    <div class="rp"></div><span class="lab">pill chips only</span>
  </div>
</div></body></html>
