<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="preview.css">
<style>
.card { padding: 22px 28px; gap: 12px; }
.title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--bxrs-ink-3); text-transform: uppercase; }
.section { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding-bottom: 8px; }
.section + .section { border-top: 1px solid #00000018; padding-top: 8px; }
.lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; color: var(--bxrs-ink-3); text-transform: uppercase; min-width: 100px; }
.glyph { font-family: var(--font-sans); font-weight: 700; font-size: 28px; color: var(--bxrs-ink); width: 44px; text-align: center; line-height: 1; }
.ico {
  width: 28px; height: 28px;
  stroke: var(--bxrs-ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;
}
.note { font-family: var(--font-mono); font-size: 11px; color: var(--bxrs-ink); }
</style></head>
<body><div class="card">
  <div class="title">Iconography — typographic glyphs first, Lucide as fallback. No emoji.</div>
  <div class="section">
    <span class="lbl">GLYPHS</span>
    <span class="glyph">→</span>
    <span class="glyph">←</span>
    <span class="glyph">↗</span>
    <span class="glyph">↑</span>
    <span class="glyph">+</span>
    <span class="glyph">×</span>
    <span class="glyph">•</span>
    <span class="note">Unicode — works on any color</span>
  </div>
  <div class="section">
    <span class="lbl">LUCIDE 2PX</span>
    <svg class="ico" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
    <svg class="ico" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
    <svg class="ico" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    <svg class="ico" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
    <svg class="ico" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
    <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor"></circle></svg>
    <span class="note">2px stroke matches 2px borders</span>
  </div>
</div></body></html>
