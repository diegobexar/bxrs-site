<!doctype html>
<html><head><meta charset="utf-8">
<title>Wordmark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="preview.css">
<style>
.card { padding: 28px 32px; justify-content: center; }
.wm {
  font-family: var(--font-display);
  font-size: 110px;
  line-height: 0.9;
  letter-spacing: -0.01em;
  text-transform: uppercase;
  color: var(--bxrs-ink);
}
.rule {
  height: 4px;
  background: var(--bxrs-ink);
  width: 360px;
  margin-top: 6px;
}
.foot {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
}
.foot .meta { font-family: var(--font-mono); font-size: 11px; color: var(--bxrs-ink-3); letter-spacing: 0.04em; }
</style></head>
<body><div class="card">
  <div class="wm">BXRS.ART</div>
  <div class="rule"></div>
  <div class="foot">
    <span class="meta">RAYGUN · DISPLAY ONLY</span>
    <span class="meta">3PX UNDERLINE</span>
  </div>
</div></body></html>
