<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Archivo:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="preview.css">
<style>
.card { padding: 22px 28px; gap: 14px; justify-content: center; }
.row { gap: 24px; align-items: flex-end; }
.row > div { display: flex; flex-direction: column; gap: 4px; }
.tag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--bxrs-ink-3); text-transform: uppercase; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; color: var(--bxrs-ink-3); text-transform: uppercase; }
.meta { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.04em; color: var(--bxrs-ink-2); }
.caption { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--bxrs-ink-3); text-transform: uppercase; }
</style></head>
<body><div class="card">
  <div class="row">
    <div>
      <span class="tag">12 · eyebrow</span>
      <div class="eyebrow">FIELD RECORDINGS · 2024</div>
    </div>
    <div>
      <span class="tag">13 · metadata</span>
      <div class="meta">OIL ON LINEN, 30×40CM</div>
    </div>
  </div>
  <div>
    <span class="tag">11 · caption</span>
    <div class="caption">FIG. 03 — NO FLASH. HANDHELD. EKTAR 100.</div>
  </div>
</div></body></html>
