<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="preview.css">
<style>
.card { padding: 22px 28px; gap: 10px; }
.title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--bxrs-ink-3); text-transform: uppercase; }
.scale { display: flex; align-items: flex-end; gap: 8px; }
.s { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.bar { background: var(--bxrs-ink); width: 14px; }
.lab { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.04em; color: var(--bxrs-ink-3); text-transform: uppercase; }
.px { font-family: var(--font-mono); font-size: 10px; color: var(--bxrs-ink); }
</style></head>
<body><div class="card">
  <div class="title">Spacing scale — powers of approximately 1.5 from 4 → 144</div>
  <div class="scale">
    <div class="s"><div class="bar" style="height:4px"></div><div class="px">4</div><div class="lab">s1</div></div>
    <div class="s"><div class="bar" style="height:8px"></div><div class="px">8</div><div class="lab">s2</div></div>
    <div class="s"><div class="bar" style="height:12px"></div><div class="px">12</div><div class="lab">s3</div></div>
    <div class="s"><div class="bar" style="height:16px"></div><div class="px">16</div><div class="lab">s4</div></div>
    <div class="s"><div class="bar" style="height:24px"></div><div class="px">24</div><div class="lab">s5</div></div>
    <div class="s"><div class="bar" style="height:32px"></div><div class="px">32</div><div class="lab">s6</div></div>
    <div class="s"><div class="bar" style="height:48px"></div><div class="px">48</div><div class="lab">s7</div></div>
    <div class="s"><div class="bar" style="height:64px"></div><div class="px">64</div><div class="lab">s8</div></div>
    <div class="s"><div class="bar" style="height:96px"></div><div class="px">96</div><div class="lab">s9</div></div>
    <div class="s"><div class="bar" style="height:144px"></div><div class="px">144</div><div class="lab">s10</div></div>
  </div>
</div></body></html>
