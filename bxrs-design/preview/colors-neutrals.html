<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="preview.css">
<style>
.card { padding: 22px 28px; gap: 14px; }
.title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--bxrs-ink-3); text-transform: uppercase; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.sw {
  aspect-ratio: 1.2/1;
  border: 1.5px solid var(--bxrs-ink);
  padding: 8px 10px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.n { font-family: var(--font-sans); font-weight: 800; text-transform: uppercase; font-size: 12px; }
.h { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; }
</style></head>
<body><div class="card">
  <div class="title">Page chrome — warm cream paper, near-black ink, no pure white surfaces</div>
  <div class="grid">
    <div class="sw" style="background:#F4EFE3;color:#111;"><div class="n">PAPER</div><div class="h">#F4EFE3</div></div>
    <div class="sw" style="background:#ECE5D2;color:#111;"><div class="n">PAPER-2</div><div class="h">#ECE5D2</div></div>
    <div class="sw" style="background:#111;color:#F4EFE3;"><div class="n">INK</div><div class="h">#111111</div></div>
    <div class="sw" style="background:#2A2A2A;color:#F4EFE3;"><div class="n">INK-2</div><div class="h">#2A2A2A</div></div>
    <div class="sw" style="background:#6E6A60;color:#F4EFE3;"><div class="n">INK-3</div><div class="h">#6E6A60</div></div>
  </div>
</div></body></html>
