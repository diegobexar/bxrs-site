<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="preview.css">
<style>
.card { padding: 24px 28px; gap: 14px; }
.title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; color: var(--bxrs-ink-3); text-transform: uppercase; }
.row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.btn {
  font-family: var(--font-sans);
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  font-size: 13px;
  padding: 10px 18px;
  border: 2px solid var(--bxrs-ink);
  background: var(--bxrs-ink);
  color: var(--bxrs-paper);
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--bxrs-ink);
  transition: transform 120ms var(--ease-out), box-shadow 120ms var(--ease-out);
}
.btn:hover { background: var(--bxrs-ink-2); }
.btn:active { transform: translate(2px,2px); box-shadow: 0 0 0 var(--bxrs-ink); }
.btn.red { background:#FF3B2E; color:#111; }
.btn.red:hover { background:#C61F12; color:#fff; }
.btn.outline { background: transparent; color: var(--bxrs-ink); box-shadow: 4px 4px 0 var(--bxrs-ink); }
.btn.outline:hover { background: var(--bxrs-ink); color: var(--bxrs-paper); }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; padding-left:4px; padding-right:4px; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.btn.ghost:hover { color: #1442FF; }
.btn .arr { margin-left: 8px; }
.sm { font-size: 11px; padding: 7px 12px; }
.lg { font-size: 16px; padding: 14px 24px; }
</style></head>
<body><div class="card">
  <div class="title">Buttons — solid, color, outline, ghost · poster shadow on solid/outline</div>
  <div class="row">
    <button class="btn">VIEW WORK <span class="arr">→</span></button>
    <button class="btn red">SUBSCRIBE</button>
    <button class="btn outline">READ NOTES</button>
    <button class="btn ghost">SKIP INTRO →</button>
  </div>
  <div class="row">
    <button class="btn sm">SMALL</button>
    <button class="btn">DEFAULT</button>
    <button class="btn lg">LARGE</button>
  </div>
</div></body></html>
